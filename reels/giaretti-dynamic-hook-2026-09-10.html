<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giaretti 自動ビンオープナー｜動的フックReel</title>
<style>
:root{color-scheme:dark;--ink:#fff9ec;--gold:#e7b65b;--deep:#111812}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0f0c;font-family:"Hiragino Sans","Yu Gothic",sans-serif}
body{display:grid;place-items:center;padding:16px}.reel{position:relative;width:min(100%,54vh);aspect-ratio:9/16;overflow:hidden;background:radial-gradient(circle at 52% 30%,#324636 0,#16241b 45%,#09100c 100%);isolation:isolate}
.reel:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.06) 55%,rgba(0,0,0,.72));z-index:4;pointer-events:none}
.scene{position:absolute;inset:0;opacity:0;animation-duration:9s;animation-iteration-count:infinite;animation-timing-function:linear}
.scene img{position:absolute;width:126%;height:70%;left:-13%;top:14%;object-fit:cover;object-position:center;background:#fff}
.s1{animation-name:s1}.s1 img{animation:hookMove 9s infinite cubic-bezier(.16,.75,.2,1)}
.s2{animation-name:s2}.s2 img{top:12%;animation:clampMove 9s infinite ease-in-out}
.s3{animation-name:s3}.s3 img{animation:resultMove 9s infinite ease-out}
@keyframes s1{0%,28%{opacity:1}33%,100%{opacity:0}}
@keyframes s2{0%,27%{opacity:0}32%,66%{opacity:1}71%,100%{opacity:0}}
@keyframes s3{0%,65%{opacity:0}70%,100%{opacity:1}}
@keyframes hookMove{0%{transform:scale(1.02) translate(-2%,4%) rotate(-1deg)}10%{transform:scale(1.3) translate(3%,-5%) rotate(1.2deg)}28%,100%{transform:scale(1.16) translate(-2%,-1%)}}
@keyframes clampMove{0%,28%{transform:scale(1.35) translate(15%,3%)}45%{transform:scale(1.05) translate(-8%,-2%)}66%,100%{transform:scale(1.24) translate(2%,-4%)}}
@keyframes resultMove{0%,66%{transform:scale(1.3) translate(-10%,0)}84%,100%{transform:scale(1.08) translate(0,-2%)}}
.copy{position:absolute;left:7%;right:7%;z-index:6;color:var(--ink);font-weight:900;line-height:1.18;text-shadow:0 3px 15px #000,0 2px 3px #000}
.hook{top:7%;font-size:clamp(25px,6.5vw,54px);animation:hookCopy 9s infinite}
.step{top:9%;font-size:clamp(23px,5.8vw,48px);animation:stepCopy 9s infinite}
.end{bottom:12%;font-size:clamp(25px,6.2vw,52px);text-align:center;animation:endCopy 9s infinite}
@keyframes hookCopy{0%,5%{opacity:0;transform:translateY(18px)}8%,27%{opacity:1;transform:none}31%,100%{opacity:0}}
@keyframes stepCopy{0%,29%{opacity:0;transform:translateX(-20px)}34%,66%{opacity:1;transform:none}70%,100%{opacity:0}}
@keyframes endCopy{0%,68%{opacity:0;transform:scale(.9)}73%,96%{opacity:1;transform:scale(1)}100%{opacity:0}}
.accent{color:var(--gold)}.pulse{position:absolute;left:21%;top:26%;width:23%;aspect-ratio:1;border:4px solid var(--gold);border-radius:50%;z-index:7;animation:pulse 9s infinite}
@keyframes pulse{0%,3%,31%,100%{opacity:0;transform:scale(.5)}6%,11%{opacity:1;transform:scale(1.3)}14%,28%{opacity:0;transform:scale(1.7)}}
.arrow{position:absolute;z-index:7;left:49%;top:53%;width:28%;height:28%;border:7px solid var(--gold);border-left-color:transparent;border-radius:50%;animation:arrow 9s infinite}
.arrow:after{content:"";position:absolute;right:-8%;bottom:6%;border:18px solid transparent;border-top-color:var(--gold);transform:rotate(-20deg)}
@keyframes arrow{0%,31%,69%,100%{opacity:0;transform:rotate(-35deg) scale(.8)}36%,64%{opacity:1;transform:rotate(55deg) scale(1)}}
.brand{position:absolute;z-index:6;left:0;right:0;bottom:4%;text-align:center;color:#f4e7c7;font-weight:700;font-size:clamp(12px,2.8vw,22px);letter-spacing:.14em;opacity:.82}
.progress{position:absolute;z-index:8;left:0;bottom:0;height:5px;background:var(--gold);animation:progress 9s infinite linear}
@keyframes progress{from{width:0}to{width:100%}}
@media(prefers-reduced-motion:reduce){.scene,.scene img,.copy,.pulse,.arrow,.progress{animation-play-state:paused}}
</style>
</head>
<body>
<main class="reel" aria-label="9秒のReel構成プレビュー">
  <section class="scene s1"><img src="https://image.rakuten.co.jp/infomart/cabinet/compass1673681316.jpg" alt="瓶に装着したGiaretti自動ビンオープナー"></section>
  <section class="scene s2"><img src="https://image.rakuten.co.jp/infomart/cabinet/compass1673681316.jpg" alt=""></section>
  <section class="scene s3"><img src="https://image.rakuten.co.jp/infomart/cabinet/compass1673681316.jpg" alt=""></section>
  <p class="copy hook">固いフタ、<br><span class="accent">まだ手で戦う？</span></p>
  <p class="copy step">置く。押す。<br><span class="accent">あとは自動。</span></p>
  <p class="copy end">瓶のフタを開ける機械。<br><span class="accent">これ、アリ？</span></p>
  <span class="pulse" aria-hidden="true"></span>
  <span class="arrow" aria-hidden="true"></span>
  <div class="brand">よろず便利商店</div>
  <div class="progress" aria-hidden="true"></div>
</main>
</body>
</html>
